[project]
name = "s1-decision-model"
version = "0.1.0"
description = "Local, open System-One style decision model (Jev-compatible interface)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "transformers>=5.0",
    "datasets>=3.0",
    "accelerate>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "datasketch>=1.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
