<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fm-title fm-desc" id="s1-v6-frozen-macro-vs-laya-root">
      <title id="fm-title">Frozen 9-family macro accuracy</title>
      <desc id="fm-desc">Bar chart of macro accuracy on the frozen 9-family holdout. Laya encoder baseline 0.410, then s1-v1 0.592, s1 v3 0.727, s1 v5 0.750, and s1-jev-cvltist 0.775. s1-jev-cvltist is the focal bar.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #s1-v6-frozen-macro-vs-laya-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #s1-v6-frozen-macro-vs-laya-root { font-family: var(--font-sans); color: var(--color-ink); }</style>
        <pattern id="s1-v6-frozen-macro-vs-laya-dots2" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#s1-v6-frozen-macro-vs-laya-dots2)" opacity="0.55"/>

      <text transform="rotate(-90 24 240)" x="24" y="240" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">MACRO ACCURACY (0–1.0)</text>

      <!-- gridlines 0..1.0 -->
      <line x1="80" y1="420" x2="960" y2="420" stroke="#2d3142" stroke-opacity="0.25" stroke-width="1"/>
      <line x1="80" y1="348" x2="960" y2="348" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
      <line x1="80" y1="276" x2="960" y2="276" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
      <line x1="80" y1="204" x2="960" y2="204" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
      <line x1="80" y1="132" x2="960" y2="132" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
      <line x1="80" y1="60"  x2="960" y2="60"  stroke="#2d3142" stroke-opacity="0.06" stroke-width="0.8"/>
      <line x1="80" y1="60" x2="80" y2="420" stroke="#2d3142" stroke-opacity="0.25" stroke-width="1"/>

      <text x="72" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.0</text>
      <text x="72" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.2</text>
      <text x="72" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.4</text>
      <text x="72" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.6</text>
      <text x="72" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.8</text>
      <text x="72" y="64"  fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">1.0</text>

      <!-- bars: pitch 176, width 110, baseline y=420, 360px per 1.0 -->
      <!-- Laya 0.410 h=148 y=272 (baseline reference) -->
      <rect x="113" y="272" width="110" height="148" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="168" y="264" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">0.410</text>

      <!-- s1v1 0.592 h=213 y=207 -->
      <rect x="289" y="207" width="110" height="213" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="344" y="199" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">0.592</text>

      <!-- s1v3 0.727 h=262 y=158 -->
      <rect x="465" y="158" width="110" height="262" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="520" y="150" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">0.727</text>

      <!-- s1v5 0.750 h=270 y=150 -->
      <rect x="641" y="150" width="110" height="270" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="696" y="142" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">0.750</text>

      <!-- s1v6 FOCAL 0.775 h=279 y=141 -->
      <rect x="817" y="141" width="110" height="279" fill="#eb6c36" fill-opacity="0.14" stroke="#eb6c36" stroke-width="1.6"/>
      <text x="872" y="133" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0.775</text>

      <!-- delta from Laya baseline at top of s1v6 -->
      <text x="872" y="115" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">+0.365 vs Laya</text>

      <!-- X category labels -->
      <text x="168" y="442" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Laya</text>
      <text x="344" y="442" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">s1-v1</text>
      <text x="520" y="442" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">s1 v3</text>
      <text x="696" y="442" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">s1 v5</text>
      <text x="872" y="442" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">s1-jev-cvltist</text>

      <!-- Legend -->
      <line x1="40" y1="474" x2="960" y2="474" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="490" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="500" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="64" y="509" fill="#4f5d75" font-size="10.5" font-family="'Geist', sans-serif">Laya — encoder baseline (the bar to beat)</text>
      <rect x="360" y="500" width="16" height="10" rx="2" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="384" y="509" fill="#4f5d75" font-size="10.5" font-family="'Geist', sans-serif">s1 versions (LoRA on Qwen3.5-4B)</text>
      <rect x="640" y="500" width="16" height="10" rx="2" fill="#eb6c36" fill-opacity="0.14" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="664" y="509" fill="#4f5d75" font-size="10.5" font-family="'Geist', sans-serif">s1-jev-cvltist (release)</text>

      <text x="40" y="528" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', monospace">Source: frozen 9-family holdout (35,594 rows, s1-jev-cvltist = full run; earlier versions = 300/family sample).</text>
    </svg>
