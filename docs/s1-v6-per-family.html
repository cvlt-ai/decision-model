<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>s1-v6 · Per-family accuracy</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1120px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.4rem, 2.2vw + 0.6rem, 1.9rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.4rem; }
    svg { width: 100%; min-width: 860px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar · Per-Family · s1-v6 · Full Holdout</p>
    <h1>Per-family accuracy — strong on most, one clear knowledge gap</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pf-title pf-desc">
      <title id="pf-title">s1-v6 per-family accuracy</title>
      <desc id="pf-desc">Bar chart of s1-v6 accuracy across the nine frozen families, sorted high to low. Strong on injection 0.992, banking77 0.932, boolq 0.913, negation 0.911, pubhealth 0.787, baserate 0.741, severity 0.657; go_emotions 0.601 is the weakest large family; mmlu_pro 0.438 is the knowledge gap and the single biggest shortfall.</desc>
      <defs>
        <pattern id="dots3" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots3)" opacity="0.55"/>

      <!-- Y-axis label -->
      <text transform="rotate(-90 24 250)" x="24" y="250" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">ACCURACY (0–1.0)</text>

      <!-- gridlines 0..1.0 -->
      <line x1="80" y1="430" x2="960" y2="430" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <line x1="80" y1="358" x2="960" y2="358" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="286" x2="960" y2="286" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="214" x2="960" y2="214" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="142" x2="960" y2="142" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="70"  x2="960" y2="70"  stroke="rgba(45,49,66,0.06)" stroke-width="0.8"/>
      <line x1="80" y1="70" x2="80" y2="430" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

      <!-- Y tick labels -->
      <text x="72" y="434" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.0</text>
      <text x="72" y="362" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.2</text>
      <text x="72" y="290" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.4</text>
      <text x="72" y="218" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.6</text>
      <text x="72" y="146" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.8</text>
      <text x="72" y="74"  fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">1.0</text>

      <!-- bars: baseline y=430, 360px per 1.0; 9 bars, left=85+i*96, width 62 -->
      <!-- i0 injection 0.9921 h=357 y=73 -->
      <rect x="85" y="73" width="62" height="357" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="116" y="65" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">0.992</text>

      <!-- i1 banking77 0.9324 h=336 y=94 -->
      <rect x="181" y="94" width="62" height="336" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="212" y="86" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">0.932</text>

      <!-- i2 boolq 0.9128 h=329 y=101 -->
      <rect x="277" y="101" width="62" height="329" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="308" y="93" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">0.913</text>

      <!-- i3 negation 0.9110 h=328 y=102 -->
      <rect x="373" y="102" width="62" height="328" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="404" y="94" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">0.911</text>

      <!-- i4 pubhealth 0.7874 h=283 y=147 -->
      <rect x="469" y="147" width="62" height="283" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="500" y="139" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">0.787</text>

      <!-- i5 baserate 0.7407 h=267 y=163 -->
      <rect x="565" y="163" width="62" height="267" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="596" y="155" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">0.741</text>

      <!-- i6 severity 0.6568 h=236 y=194 -->
      <rect x="661" y="194" width="62" height="236" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="692" y="186" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">0.657</text>

      <!-- i7 go_emotions 0.6005 (gap) h=216 y=214 -->
      <rect x="757" y="214" width="62" height="216" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="788" y="206" fill="#eb6c36" font-size="9.5" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0.601</text>

      <!-- i8 mmlu_pro 0.4383 (THE gap, focal) h=158 y=272 -->
      <rect x="853" y="272" width="62" height="158" fill="rgba(235,108,54,0.16)" stroke="#eb6c36" stroke-width="1.6"/>
      <text x="884" y="264" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0.438</text>
      <text x="884" y="248" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gap</text>

      <!-- X category labels -->
      <text x="116" y="452" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">injection</text>
      <text x="212" y="452" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">banking77</text>
      <text x="308" y="452" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">boolq</text>
      <text x="404" y="452" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">negation</text>
      <text x="500" y="452" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pubhealth</text>
      <text x="596" y="452" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">baserate</text>
      <text x="692" y="452" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">severity</text>
      <text x="788" y="452" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">go_emotions</text>
      <text x="884" y="452" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mmlu_pro</text>

      <!-- strong-vs-gap divider annotation -->
      <line x1="735" y1="120" x2="735" y2="430" stroke="rgba(235,108,54,0.5)" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="731" y="112" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="end">strong</text>
      <text x="741" y="112" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start">gap</text>

      <!-- Legend -->
      <line x1="40" y1="480" x2="960" y2="480" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="496" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="506" width="16" height="10" rx="2" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="64" y="515" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Strong families (≥0.65)</text>
      <rect x="240" y="506" width="16" height="10" rx="2" fill="rgba(235,108,54,0.16)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="264" y="515" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Gap: go_emotions (weakest large fam) · mmlu_pro (the knowledge gap)</text>

      <text x="40" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Source: s1-v6 full frozen holdout (35,594 rows). Sorted high→low. baserate n=27, injection n=126 — wide confidence intervals.</text>
    </svg>
  </div>
</body>
</html>
