<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>s1-jev-cvltist serving stack</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
      --color-accent: #eb6c36; --color-rule: #d5d9e2;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
               letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.2vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1200px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Serving Stack · Diagram Design</p>
    <h1>s1-jev-cvltist: a Jev wire request becomes calibrated probabilities</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1240 560" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="s1serve-title s1serve-desc">
        <title id="s1serve-title">s1-jev-cvltist serving stack</title>
        <desc id="s1serve-desc">A Jev wire request flows through the FastAPI server, wire validation, and the logit readout, which drives the Qwen3.5-4B base model with the s1-jev-cvltist LoRA adapter to emit calibrated probabilities, returned as a Jev wire response.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===================== ARROWS (drawn first) ===================== -->
        <!-- top request path: A->B->C->D->H -->
        <line x1="240" y1="164" x2="282" y2="164" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="488" y1="164" x2="530" y2="164" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="736" y1="164" x2="778" y2="164" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="984" y1="164" x2="1026" y2="164" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
        <!-- D <-> E model round trip -->
        <line x1="844" y1="208" x2="844" y2="354" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="924" y1="360" x2="924" y2="214" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

        <!-- arrow labels (opaque paper mask behind each) -->
        <rect x="752" y="150" width="120" height="14" fill="#f5f5f5"/>
        <text x="812" y="161" font-family="'Geist Mono', monospace" font-size="10" fill="#4f5d75" text-anchor="middle">render prompt</text>
        <rect x="852" y="274" width="66" height="14" fill="#f5f5f5"/>
        <text x="858" y="285" font-family="'Geist Mono', monospace" font-size="10" fill="#4f5d75">forward</text>
        <rect x="932" y="274" width="56" height="14" fill="#f5f5f5"/>
        <text x="938" y="285" font-family="'Geist Mono', monospace" font-size="10" fill="#4f5d75">logits</text>
        <rect x="986" y="140" width="46" height="14" fill="#f5f5f5"/>
        <text x="1009" y="151" font-family="'Geist Mono', monospace" font-size="10" fill="#eb6c36" text-anchor="middle">probs</text>

        <!-- ===================== NODES ===================== -->
        <!-- A: client (external, dashed) -->
        <g>
          <rect x="40" y="120" width="200" height="88" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5 4"/>
          <text x="52" y="142" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="1" fill="#4f5d75">CLIENT · EXTERNAL</text>
          <text x="52" y="168" font-family="'Geist', sans-serif" font-size="15" font-weight="600" fill="#2d3142">Jev caller</text>
          <text x="52" y="188" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">POST /v1/answer</text>
        </g>

        <!-- B: serve_s1.py (focal accent) -->
        <g>
          <rect x="288" y="120" width="200" height="88" rx="6" fill="#fdf1ea" stroke="#eb6c36" stroke-width="1.6"/>
          <rect x="468" y="132" width="8" height="8" rx="1" fill="#eb6c36"/>
          <text x="300" y="142" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="1" fill="#eb6c36">FASTAPI · NEW</text>
          <text x="300" y="168" font-family="'Geist', sans-serif" font-size="15" font-weight="600" fill="#2d3142">serve_s1.py</text>
          <text x="300" y="188" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">:8000 · T=1.5</text>
        </g>

        <!-- C: schema.py (module) -->
        <g>
          <rect x="536" y="120" width="200" height="88" rx="6" fill="#ffffff" stroke="#d5d9e2" stroke-width="1.2"/>
          <text x="548" y="142" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="1" fill="#4f5d75">MODULE</text>
          <text x="548" y="168" font-family="'Geist', sans-serif" font-size="15" font-weight="600" fill="#2d3142">schema.py</text>
          <text x="548" y="188" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">parse · validate · render</text>
        </g>

        <!-- D: LogitReadout (focal accent) -->
        <g>
          <rect x="784" y="120" width="200" height="88" rx="6" fill="#fdf1ea" stroke="#eb6c36" stroke-width="1.6"/>
          <rect x="964" y="132" width="8" height="8" rx="1" fill="#eb6c36"/>
          <text x="796" y="142" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="1" fill="#eb6c36">READOUT · CORE</text>
          <text x="796" y="168" font-family="'Geist', sans-serif" font-size="15" font-weight="600" fill="#2d3142">LogitReadout</text>
          <text x="796" y="188" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">single-token key scoring</text>
        </g>

        <!-- H: response (output) -->
        <g>
          <rect x="1032" y="120" width="168" height="88" rx="6" fill="#ffffff" stroke="#d5d9e2" stroke-width="1.2"/>
          <text x="1044" y="142" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="1" fill="#4f5d75">RESPONSE</text>
          <text x="1044" y="168" font-family="'Geist', sans-serif" font-size="14" font-weight="600" fill="#2d3142">Jev wire answer</text>
          <text x="1044" y="186" font-family="'Geist Mono', monospace" font-size="10.5" fill="#4f5d75">{choice, probs}</text>
          <text x="1044" y="200" font-family="'Geist Mono', monospace" font-size="10.5" fill="#4f5d75">~500ms / req</text>
        </g>

        <!-- E: model (base + LoRA) -->
        <g>
          <rect x="536" y="360" width="448" height="88" rx="6" fill="#ffffff" stroke="#d5d9e2" stroke-width="1.2"/>
          <text x="548" y="382" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="1" fill="#4f5d75">MODEL · GPU cuda:0</text>
          <text x="548" y="408" font-family="'Geist', sans-serif" font-size="15" font-weight="600" fill="#2d3142">Qwen3.5-4B  +  LoRA s1-jev-cvltist</text>
          <text x="548" y="428" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">base Apache-2.0 · adapter 124 MB · r16 α32 · bf16 · 4096</text>
        </g>

        <!-- ===================== LEGEND (bottom strip) ===================== -->
        <g font-family="'Geist Mono', monospace" font-size="10.5" fill="#4f5d75">
          <line x1="40" y1="500" x2="1200" y2="500" stroke="#d5d9e2" stroke-width="1"/>
          <rect x="40" y="516" width="10" height="10" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-dasharray="3 2"/>
          <text x="58" y="525">external / caller</text>
          <rect x="180" y="516" width="10" height="10" rx="2" fill="#fdf1ea" stroke="#eb6c36" stroke-width="1.5"/>
          <text x="198" y="525">focal (new server · readout core)</text>
          <rect x="430" y="516" width="10" height="10" rx="2" fill="#ffffff" stroke="#d5d9e2"/>
          <text x="448" y="525">module / model</text>
          <line x1="580" y1="521" x2="612" y2="521" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
          <text x="620" y="525">request / forward</text>
          <line x1="760" y1="521" x2="792" y2="521" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
          <text x="800" y="525">calibrated output (T=1.5)</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
