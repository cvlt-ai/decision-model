<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jb-title jb-desc" id="s1-v6-jevbench-comparison-root">
      <title id="jb-title">JevBench public-231 accuracy</title>
      <desc id="jb-desc">Bar chart of JevBench public-231 accuracy. s1-v3 0.693, s1-v4 0.671, s1-v5 0.749, and s1-v6 0.775 show our progression; external baselines openjev 0.814 and Jev 1.13 0.866. s1-v6 is the focal bar.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #s1-v6-jevbench-comparison-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #s1-v6-jevbench-comparison-root { font-family: var(--font-sans); color: var(--color-ink); }</style>
        <pattern id="s1-v6-jevbench-comparison-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#s1-v6-jevbench-comparison-dots)" opacity="0.55"/>

      <!-- Y-axis rotated label -->
      <text transform="rotate(-90 24 240)" x="24" y="240" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">ACCURACY (0–1.0)</text>

      <!-- gridlines 0..1.0 -->
      <line x1="80" y1="420" x2="960" y2="420" stroke="#2d3142" stroke-opacity="0.25" stroke-width="1"/>
      <line x1="80" y1="348" x2="960" y2="348" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
      <line x1="80" y1="276" x2="960" y2="276" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
      <line x1="80" y1="204" x2="960" y2="204" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
      <line x1="80" y1="132" x2="960" y2="132" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
      <line x1="80" y1="60"  x2="960" y2="60"  stroke="#2d3142" stroke-opacity="0.06" stroke-width="0.8"/>
      <line x1="80" y1="60" x2="80" y2="420" stroke="#2d3142" stroke-opacity="0.25" stroke-width="1"/>

      <!-- Y tick labels -->
      <text x="72" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.0</text>
      <text x="72" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.2</text>
      <text x="72" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.4</text>
      <text x="72" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.6</text>
      <text x="72" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.8</text>
      <text x="72" y="64"  fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">1.0</text>

      <!-- bars: pitch 140, width 84; baseline y=420, scale 360px/1.0 -->
      <!-- s1v3 0.693 h=249 y=171 -->
      <rect x="100" y="171" width="84" height="249" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="142" y="163" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">0.693</text>

      <!-- s1v4 0.671 h=242 y=178 -->
      <rect x="240" y="178" width="84" height="242" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="282" y="170" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">0.671</text>

      <!-- s1v5 0.749 h=270 y=150 -->
      <rect x="380" y="150" width="84" height="270" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="422" y="142" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">0.749</text>

      <!-- s1v6 FOCAL 0.775 h=279 y=141 -->
      <rect x="520" y="141" width="84" height="279" fill="#eb6c36" fill-opacity="0.14" stroke="#eb6c36" stroke-width="1.6"/>
      <text x="562" y="133" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0.775</text>

      <!-- openjev 0.814 (external) h=293 y=127 -->
      <rect x="660" y="127" width="84" height="293" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="702" y="119" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">0.814</text>

      <!-- Jev 1.13 0.866 (external) h=312 y=108 -->
      <rect x="800" y="108" width="84" height="312" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="842" y="100" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">0.866</text>

      <!-- X category labels -->
      <text x="142" y="442" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">s1-v3</text>
      <text x="282" y="442" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">s1-v4</text>
      <text x="422" y="442" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">s1-v5</text>
      <text x="562" y="442" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">s1-v6</text>
      <text x="702" y="442" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">openjev</text>
      <text x="842" y="442" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Jev 1.13</text>

      <!-- gap annotation between s1-v6 and openjev -->
      <text x="628" y="92" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">−0.039</text>
      <text x="770" y="74" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">−0.091</text>

      <!-- Legend -->
      <line x1="40" y1="474" x2="960" y2="474" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="490" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="500" width="16" height="10" rx="2" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
      <text x="64" y="509" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">s1 training versions (local runs)</text>
      <rect x="290" y="500" width="16" height="10" rx="2" fill="#eb6c36" fill-opacity="0.14" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="314" y="509" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">s1-v6 (release checkpoint)</text>
      <rect x="520" y="500" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="544" y="509" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External baseline (published / documented, not local)</text>

      <!-- source note -->
      <text x="40" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Source: JevBench public-231, harness score_task, 4096 context. Jev 1.13 = 0.866 and openjev v5 = 0.814 as documented.</text>
    </svg>
