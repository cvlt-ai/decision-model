<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>s1-v6 · Frozen 9-family macro accuracy vs Laya</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.4rem, 2.2vw + 0.6rem, 1.9rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.4rem; }
    svg { width: 100%; min-width: 780px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar · Frozen 9-Family Macro · s1-v6</p>
    <h1>Our own frozen suite — from encoder baseline to s1-v6</h1>

    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fm-title fm-desc">
      <title id="fm-title">Frozen 9-family macro accuracy</title>
      <desc id="fm-desc">Bar chart of macro accuracy on the frozen 9-family holdout. Laya encoder baseline 0.410, then s1-v1 0.592, s1-v3 0.727, s1-v5 0.750, and s1-v6 0.775. s1-v6 is the focal bar.</desc>
      <defs>
        <pattern id="dots2" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots2)" opacity="0.55"/>

      <text transform="rotate(-90 24 240)" x="24" y="240" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">MACRO ACCURACY (0–1.0)</text>

      <!-- gridlines 0..1.0 -->
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <line x1="80" y1="348" x2="960" y2="348" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="276" x2="960" y2="276" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="204" x2="960" y2="204" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="132" x2="960" y2="132" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="60"  x2="960" y2="60"  stroke="rgba(45,49,66,0.06)" stroke-width="0.8"/>
      <line x1="80" y1="60" x2="80" y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

      <text x="72" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.0</text>
      <text x="72" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.2</text>
      <text x="72" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.4</text>
      <text x="72" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.6</text>
      <text x="72" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.8</text>
      <text x="72" y="64"  fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">1.0</text>

      <!-- bars: pitch 176, width 110, baseline y=420, 360px per 1.0 -->
      <!-- Laya 0.410 h=148 y=272 (baseline reference) -->
      <rect x="113" y="272" width="110" height="148" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="168" y="264" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">0.410</text>

      <!-- s1v1 0.592 h=213 y=207 -->
      <rect x="289" y="207" width="110" height="213" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="344" y="199" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">0.592</text>

      <!-- s1v3 0.727 h=262 y=158 -->
      <rect x="465" y="158" width="110" height="262" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="520" y="150" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">0.727</text>

      <!-- s1v5 0.750 h=270 y=150 -->
      <rect x="641" y="150" width="110" height="270" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="696" y="142" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">0.750</text>

      <!-- s1v6 FOCAL 0.775 h=279 y=141 -->
      <rect x="817" y="141" width="110" height="279" fill="rgba(235,108,54,0.14)" stroke="#eb6c36" stroke-width="1.6"/>
      <text x="872" y="133" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0.775</text>

      <!-- delta from Laya baseline at top of s1v6 -->
      <text x="872" y="115" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">+0.365 vs Laya</text>

      <!-- X category labels -->
      <text x="168" y="442" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Laya</text>
      <text x="344" y="442" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">s1-v1</text>
      <text x="520" y="442" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">s1-v3</text>
      <text x="696" y="442" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">s1-v5</text>
      <text x="872" y="442" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">s1-v6</text>

      <!-- Legend -->
      <line x1="40" y1="474" x2="960" y2="474" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="490" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="500" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="64" y="509" fill="#4f5d75" font-size="10.5" font-family="'Geist', sans-serif">Laya — encoder baseline (the bar to beat)</text>
      <rect x="360" y="500" width="16" height="10" rx="2" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="384" y="509" fill="#4f5d75" font-size="10.5" font-family="'Geist', sans-serif">s1 versions (LoRA on Qwen3.5-4B)</text>
      <rect x="640" y="500" width="16" height="10" rx="2" fill="rgba(235,108,54,0.14)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="664" y="509" fill="#4f5d75" font-size="10.5" font-family="'Geist', sans-serif">s1-v6 (release)</text>

      <text x="40" y="528" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', monospace">Source: frozen 9-family holdout (35,594 rows, s1-v6 = full run; earlier versions = 300/family sample).</text>
    </svg>
  </div>
</body>
</html>
